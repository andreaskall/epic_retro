<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Master - Code Typing Championship</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='master.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Game Master Control Panel</h1>
            <p class="subtitle">Monitor players and control game flow</p>
        </header>

        <!-- Pre-game -->
        <div id="pregame-section" class="section">
            <div class="control-box">
                <h2>Game Setup</h2>
                <p id="player-count" class="player-count">0 players connected</p>

                <div class="time-setting">
                    <label for="time-limit">Time Limit per Round:</label>
                    <select id="time-limit">
                        <option value="60">60 seconds</option>
                        <option value="90" selected>90 seconds</option>
                        <option value="120">2 minutes</option>
                        <option value="180">3 minutes</option>
                        <option value="300">5 minutes</option>
                        <option value="0">No limit</option>
                    </select>
                </div>

                <button id="start-game-btn" class="btn btn-success btn-large">Start Game</button>
            </div>
        </div>

        <!-- Active Game -->
        <div id="game-section" class="section hidden">
            <div class="round-control">
                <h2>Round <span id="current-round-num">1</span> of <span id="total-rounds-num">10</span></h2>
                <p id="completion-status" class="completion-status">0 of 0 players completed</p>
                <button id="next-round-btn" class="btn btn-success btn-large">Next Round</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Players</div>
                    <div id="stat-players" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completed Round</div>
                    <div id="stat-completed" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">In Progress</div>
                    <div id="stat-in-progress" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Score</div>
                    <div id="stat-top-score" class="stat-value">0</div>
                </div>
            </div>

            <div class="player-monitor">
                <h2>Player Progress</h2>
                <div id="player-grid" class="player-grid"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='master.js') }}"></script>
</body>
</html>
